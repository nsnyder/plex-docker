# Plex Media Server plus Watchtower auto-updates.
# Put this file in ~/plex/ next to a .env file that holds PLEX_CLAIM.
# Start with: docker compose up -d

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped
    environment:
      # This image's names for the user and group Plex runs as:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=America/New_York
      # One-time claim token, read from the .env file:
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - ADVERTISE_IP=http://192.168.1.6:32400,https://plex.snydern.com:443
    networks:
      # Join Traefik's network; don't also stay on the default one, or Traefik may pick the wrong IP.
      - gateway
    ports:
      - 32400:32400/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    devices:
      # pass the Intel GPU through for Quick Sync hardware transcoding (needs Plex Pass).
      - /dev/dri:/dev/dri
    volumes:
      # Plex config and database stay on the Mac's local disk (SQLite performs badly on NFS).
      - ./config:/config
      # Scratch space for transcodes; set the transcoder temp directory to /transcode in Plex settings.
      - ./transcode:/transcode
      - /media/mycloud:/media/mycloud:ro
    labels:
      # Opt this container in to Watchtower updates.
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      # tell Traefik which network to reach Plex on:
      - traefik.docker.network=local-services_gateway
      - traefik.http.routers.plex.rule=Host(`plex.snydern.com`)
      - traefik.http.routers.plex.entrypoints=websecure
      - traefik.http.routers.plex.tls.certresolver=le
      # Plex serves plain HTTP on 32400 inside the container.
      - traefik.http.services.plex.loadbalancer.server.port=32400

  watchtower:
    # Maintained fork; the original containrrr/watchtower repository is archived.
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Watchtower needs the Docker socket to pull images and restart containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/New_York
      # Only touch containers that carry the watchtower.enable=true label.
      - WATCHTOWER_LABEL_ENABLE=true
      # Delete the old image after each update so disk space is not wasted.
      - WATCHTOWER_CLEANUP=true
      # Check for updates daily at 4:00 AM (cron format with a leading seconds field).
      - "WATCHTOWER_SCHEDULE=0 0 4 * * *"

networks:
  gateway:
    # The network your Traefik compose project already created:
    external: true
    name: local-services_gateway